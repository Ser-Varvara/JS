<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8 - Варівара</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <button class="hamburger" id="hamburger">☰</button>
    <ul class="nav-menu" id="nav-menu">
        <li><a href="#">Головна</a></li>
        <li><a href="#">Про нас</a></li>
        <li><a href="#">Послуги</a></li>
        <li><a href="#">Контакти</a></li>
    </ul>
</nav>

<div class="carousel-container">
    <div class="carousel-slide" id="carousel-slide">
        <img src="https://placehold.co/800x400?text=Слайд+1" alt="1">
        <img src="https://placehold.co/800x400?text=Слайд+2" alt="2">
        <img src="https://placehold.co/800x400?text=Слайд+3" alt="3">
    </div>
    <button class="prev" id="prevBtn">❮</button>
    <button class="next" id="nextBtn">❯</button>
    <div class="dots-container" id="dots-container"></div>
</div>

<div class="content-images">
    <div class="large-only">
        <h3>Тільки для Large (≥768px)</h3>
        <img src="https://placehold.co/300x200?text=Large+1" alt="L1">
        <img src="https://placehold.co/300x200?text=Large+2" alt="L2">
    </div>
    <div class="medium-only">
        <h3>Тільки для Medium (<768px)</h3>
        <img src="https://placehold.co/200x150?text=Medium+1" alt="M1">
        <img src="https://placehold.co/200x150?text=Medium+2" alt="M2">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
